name: Translate Range (chạy tay)

# Dịch 1 khoảng chương bắt đầu từ URL bất kỳ (vd nhảy cóc tới chương mới
# nhất khi site còn thiếu đoạn giữa) rồi công bố qua Worker API.
# Số chương công bố lấy theo catalog.json của truyện.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Slug truyện (thư mục trong novels/)'
        required: true
      url:
        description: 'URL chương bắt đầu (phải có trong catalog.json)'
        required: true
      chapters:
        description: 'Số chương cần dịch (0 = tới hết catalog)'
        required: false
        default: '0'

concurrency:
  group: cloud-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  translate_range:
    if: vars.ALLOW_CLOUD_WRITES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.lock
          playwright install --with-deps chromium

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Dịch & công bố khoảng chương
        env:
          HEADLESS: "true"
          RANGE_SLUG: ${{ inputs.slug }}
          RANGE_URL: ${{ inputs.url }}
          RANGE_CHAPTERS: ${{ inputs.chapters }}
          HACDAO_ALLOW_CLOUD_WRITES: 'false'
          HACDAO_R2_WRITE_BUDGET: ${{ vars.HACDAO_R2_WRITE_BUDGET || '0' }}
          HACDAO_D1_WRITE_BUDGET: ${{ vars.HACDAO_D1_WRITE_BUDGET || '0' }}
          HACDAO_MAX_OPS_PER_RUN: ${{ vars.HACDAO_MAX_OPS_PER_RUN || '0' }}
          HACDAO_BUDGET_FILE: tools/.cloud_sync_budget.json
          HACDAO_SYNC_KEY: ${{ secrets.HACDAO_SYNC_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEYS: ${{ secrets.GOOGLE_API_KEYS || secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS || secrets.GOOGLE_API_KEYS }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python tools/translate_range.py --slug "$RANGE_SLUG" --url "$RANGE_URL" --chapters "$RANGE_CHAPTERS"

      - name: Commit và push kết quả
        if: always()
        env:
          RANGE_SLUG: ${{ inputs.slug }}
        run: |
          case "$RANGE_SLUG" in *[!a-z0-9-]*|"") echo "slug không hợp lệ"; exit 1;; esac
          bash tools/commit_sync_state.sh "auto(translate): dịch khoảng chương $RANGE_SLUG" "novels/$RANGE_SLUG/"

      - name: Commit ngân sách đã sử dụng
        if: always()
        run: |
          bash tools/commit_sync_state.sh "auto(sync): lưu ngân sách đã sử dụng" tools/.cloud_sync_budget.json
