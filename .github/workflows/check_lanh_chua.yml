name: Auto Check & Translate Lanh Chua (Daily 12:00 AM VN Time)

on:
  schedule:
    - cron: '0 17 * * *' # 00:00 giờ Việt Nam; chỉ chạy khi đã bật biến kiểm soát chi phí
  workflow_dispatch:

concurrency:
  group: cloud-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check_and_translate:
    if: vars.ALLOW_CLOUD_WRITES == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.lock
          playwright install --with-deps chromium

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Run Auto Check & Translate
        env:
          HEADLESS: "true"
          HACDAO_ALLOW_CLOUD_WRITES: 'false'
          HACDAO_R2_WRITE_BUDGET: ${{ vars.HACDAO_R2_WRITE_BUDGET || '0' }}
          HACDAO_D1_WRITE_BUDGET: ${{ vars.HACDAO_D1_WRITE_BUDGET || '0' }}
          HACDAO_MAX_OPS_PER_RUN: ${{ vars.HACDAO_MAX_OPS_PER_RUN || '0' }}
          HACDAO_BUDGET_FILE: tools/.cloud_sync_budget.json
          HACDAO_SYNC_KEY: ${{ secrets.HACDAO_SYNC_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEYS: ${{ secrets.GOOGLE_API_KEYS || secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS || secrets.GOOGLE_API_KEYS }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python tools/auto_check_lanh_chua.py

      - name: Commit và push kết quả
        if: always()
        run: |
          bash tools/commit_sync_state.sh "auto(translate): cập nhật chương mới" novels/lanh-chua-cau-sinh-thien-phu-hop-thanh/ frontend/src/content/announcements.json

      - name: Lưu ngân sách kể cả khi tác vụ thất bại
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: translation-budget-checkpoint
          path: tools/.cloud_sync_budget.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit ngân sách đã sử dụng
        if: always()
        run: |
          bash tools/commit_sync_state.sh "auto(sync): lưu ngân sách đã sử dụng" tools/.cloud_sync_budget.json
