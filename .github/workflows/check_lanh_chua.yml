name: Auto Check & Translate Lanh Chua (Daily 12:00 AM VN Time)

on:
  schedule:
    - cron: '0 17 * * *' # 12:00 AM VN Time (00:00 GMT+7) — ~5 request/ngày (100% Free)
  workflow_dispatch:

concurrency:
  group: check-lanh-chua
  cancel-in-progress: false

jobs:
  check_and_translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python Dependencies
        run: |
          pip install requests beautifulsoup4 playwright python-slugify
          playwright install chromium

      - name: Install Frontend Dependencies
        run: |
          cd frontend && npm ci

      - name: Run Auto Check & Translate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HACDAO_SYNC_KEY: ${{ secrets.HACDAO_SYNC_KEY }}
        run: |
          python tools/auto_check_lanh_chua.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name 'AutoTranslator Bot'
          git config --global user.email 'bot@hacdaotruyen.local'
          git add novels/lanh-chua-cau-sinh-thien-phu-hop-thanh/ frontend/src/content/announcements.json || true
          git commit -m "auto(translate): cập nhật chương mới cho Lãnh Chúa Cầu Sinh" || true
          git push origin main || true
