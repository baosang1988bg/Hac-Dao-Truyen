name: Deploy Production (Cloudflare Workers)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Chỉ build & kiểm tra, không chạy wrangler deploy'
        type: boolean
        required: false
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/prod' && vars.ALLOW_CLOUD_WRITES == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout prod
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root & frontend dependencies
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Quality Gate (lint + build frontend)
        run: |
          npm run lint
          npm run build --prefix frontend

      - name: Deploy to Cloudflare Workers
        if: ${{ !inputs.dry_run }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
