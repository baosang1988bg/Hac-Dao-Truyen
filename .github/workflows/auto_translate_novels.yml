name: Auto Check & Translate Novels (2x/ngày)

# Tổng quát hóa từ check_lanh_chua.yml cũ (hardcode 1 truyện) — giờ chạy
# tools/auto_check_novel.py KHÔNG kèm --slug, tự khám phá MỌI truyện có
# `auto_check.enabled: true` trong novel.json rồi lần lượt kiểm tra + dịch.
# Thêm truyện mới vào auto-check chỉ cần sửa novel.json, không cần sửa file này.
on:
  schedule:
    # Cố tình LỆCH giờ tròn (không dùng "0 17"/"0 5") — GitHub khuyến cáo tránh
    # đúng đầu giờ vì đó là lúc tải scheduled-workflow cao nhất trên toàn nền
    # tảng, dễ bị trễ nhiều tiếng. Lệch vài phút không đổi ý nghĩa "~00h"/"~12h"
    # nhưng giảm phần nào độ trễ (không loại bỏ hoàn toàn — đây là giới hạn của
    # GitHub Actions free scheduler, không phải lỗi trong workflow này).
    - cron: '7 17 * * *'  # ~00:07 giờ Việt Nam
    - cron: '53 4 * * *'  # ~11:53 giờ Việt Nam
  workflow_dispatch:

concurrency:
  group: cloud-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check_and_translate:
    if: vars.ALLOW_CLOUD_WRITES == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.lock
          playwright install --with-deps chromium

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Run Auto Check & Translate (mọi truyện auto_check.enabled)
        env:
          HEADLESS: "true"
          HACDAO_ALLOW_CLOUD_WRITES: 'false'
          HACDAO_R2_WRITE_BUDGET: ${{ vars.HACDAO_R2_WRITE_BUDGET || '0' }}
          HACDAO_D1_WRITE_BUDGET: ${{ vars.HACDAO_D1_WRITE_BUDGET || '0' }}
          HACDAO_MAX_OPS_PER_RUN: ${{ vars.HACDAO_MAX_OPS_PER_RUN || '0' }}
          HACDAO_BUDGET_FILE: tools/.cloud_sync_budget.json
          HACDAO_SYNC_KEY: ${{ secrets.HACDAO_SYNC_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEYS: ${{ secrets.GOOGLE_API_KEYS || secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS || secrets.GOOGLE_API_KEYS }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python tools/auto_check_novel.py

      - name: Commit và push kết quả
        if: always()
        run: |
          bash tools/commit_sync_state.sh "auto(translate): cập nhật chương mới" novels/ frontend/src/content/announcements.json

      - name: Lưu ngân sách kể cả khi tác vụ thất bại
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: translation-budget-checkpoint
          path: tools/.cloud_sync_budget.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit ngân sách đã sử dụng
        if: always()
        run: |
          bash tools/commit_sync_state.sh "auto(sync): lưu ngân sách đã sử dụng" tools/.cloud_sync_budget.json
