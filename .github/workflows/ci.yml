name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cài dependency kiểm thử
        run: pip install -r requirements-dev.lock
      - name: Kiểm tra Python với dữ liệu cô lập
        run: python -m pytest -q
      - name: Kiểm tra không theo dõi secret
        run: |
          ! git ls-files | grep -E '^\.env$|^\.dev\.vars$|^key_status\.json$'

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check src/index.js
      - name: Kiểm thử Worker, schema và D1/R2 local
        run: npm run test:worker

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm run build --prefix frontend
      - name: Chuẩn bị trình duyệt
        run: |
          pip install -r requirements-dev.lock
          python -m playwright install --with-deps chromium
      - name: Smoke test với API giả lập, không gọi production
        run: python tests/browser/smoke.py
