name: Cloud-to-Cloud Sync (Google Drive to Cloudflare R2)

on:
  workflow_dispatch: # Cho phép bấm thủ công khi cần — KHÔNG tự động chạy cron 30 phút/lần nữa

concurrency:
  group: cloud-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: vars.ALLOW_CLOUD_WRITES == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Create Credentials & Token Files
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: |
          echo "$GDRIVE_CREDENTIALS" > tools/credentials.json
          echo "$GDRIVE_TOKEN" > tools/token.json

      - name: Execute Cloud-to-Cloud Sync
        env:
          HACDAO_SYNC_KEY: ${{ secrets.HACDAO_SYNC_KEY }}
        run: |
          python tools/cloud_to_cloud_syncer.py --state-file tools/remote_state.json --workers 1

      - name: Lưu checkpoint kể cả khi sync thất bại
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-sync-checkpoint
          path: |
            tools/.cloud_sync_state.json
            tools/.cloud_sync_budget.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit và push checkpoint
        run: bash tools/commit_sync_state.sh "auto(sync): cập nhật checkpoint" tools/.cloud_sync_state.json tools/.cloud_sync_budget.json
